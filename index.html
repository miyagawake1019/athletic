<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kart Racing Game</title>
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts: Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; overflow: hidden; font-family: 'Noto Sans JP', sans-serif; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
            font-size: 18px;
        }
        #hud {
            position: absolute;
            top: 40px;
            left: 20px;
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px black;
            pointer-events: none;
        }
        #lap-counter {
            font-weight: bold;
            color: #ffcc00;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            color: gold;
            text-shadow: 3px 3px 6px black;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">
        上矢印: アクセル | 下矢印: ブレーキ/バック | 左右矢印: ハンドル<br>
        3周してゴールを目指せ！
    </div>
    <div id="hud">
        LAP: <span id="lap-counter">1 / 3</span><br>
        TIME: <span id="time-counter">0.00</span>
    </div>
    <div id="message">GOAL!!</div>

    <!-- Three.js CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
